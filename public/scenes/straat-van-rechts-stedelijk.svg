<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Stedelijke straat met zijstraat van rechts</title>
  <desc id="desc">Modulaire vierkante SVG in loodrecht bovenaanzicht van een stedelijke T-kruising. Een gelijkwaardig vormgegeven straat komt van rechts; er zijn geen haaientanden, verkeersborden of voertuigen.</desc>

  <defs>
    <symbol id="grass-tuft" viewBox="-12 -12 24 24">
      <path d="M0 10C-1 2-5-4-10-8M0 10C1 1 5-5 10-9M0 10C0 0-1-7 1-12" fill="none" stroke="#659951" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <symbol id="street-tree" viewBox="-34 -34 68 68">
      <circle cx="4" cy="5" r="26" fill="#477C43" opacity=".2"/>
      <circle r="25" fill="#5B9551" stroke="#3F7040" stroke-width="4"/>
      <circle cx="-8" cy="-7" r="10" fill="#77AC65" opacity=".65"/>
    </symbol>
  </defs>

  <!-- LAAG 1: het wegdek vormt logisch één T-kruising -->
  <g id="module-background" data-module="background">
    <rect width="1024" height="1024" fill="#596168"/>
  </g>
  <g id="module-roads" data-module="roads" fill="#596168">
    <rect x="360" width="304" height="1024"/>
    <rect x="664" y="360" width="360" height="304"/>
  </g>

  <!-- LAAG 2: stedelijke stoepen met afgeronde hoeken bij de zijstraat -->
  <g id="module-sidewalks" data-module="sidewalks" fill="#D8DADB">
    <rect width="360" height="1024"/>
    <path d="M664 0H1024V360H702A38 38 0 0 1 664 322Z"/>
    <path d="M1024 664H702A38 38 0 0 0 664 702V1024H1024Z"/>
  </g>

  <!-- LAAG 3: groene voortuinen en plantsoenen -->
  <g id="module-green-verges" data-module="green-verges" fill="#9FC77D" stroke="#B8BDC0" stroke-width="5">
    <rect width="320" height="1024"/>
    <path d="M704 0H1024V320H734Q704 320 704 290Z"/>
    <path d="M734 704H1024V1024H704V734Q704 704 734 704Z"/>
    <path d="M0 0H190L0 190Z" fill="#ADD18C" stroke="none" opacity=".5"/>
    <path d="M1024 1024H840L1024 840Z" fill="#ADD18C" stroke="none" opacity=".42"/>
  </g>

  <!-- LAAG 4: stoepranden; links loopt de stoep ononderbroken door -->
  <g id="module-curbs" data-module="curbs" fill="none" stroke="#41494F" stroke-width="7" stroke-linecap="round">
    <path d="M360 0V1024"/>
    <path d="M664 0V322A38 38 0 0 0 702 360H1024"/>
    <path d="M1024 664H702A38 38 0 0 0 664 702V1024"/>
  </g>

  <!-- LAAG 5: normale middenstrepen; geen markering in het kruispunt -->
  <g id="module-road-markings" data-module="road-markings" fill="none" stroke="#F7F5ED" stroke-width="10" stroke-linecap="butt" stroke-dasharray="48 32">
    <path d="M512 0V320"/>
    <path d="M512 704V1024"/>
    <path d="M704 512H1024"/>
  </g>

  <!-- LAAG 6: bomen en lage begroeiing -->
  <g id="module-urban-details" data-module="urban-details">
    <use href="#street-tree" x="250" y="315" width="68" height="68"/>
    <use href="#street-tree" x="234" y="625" width="68" height="68"/>
    <use href="#street-tree" x="715" y="260" width="68" height="68"/>
    <use href="#street-tree" x="706" y="700" width="68" height="68"/>
    <g opacity=".9">
      <use href="#grass-tuft" x="88" y="350" width="24" height="24"/>
      <use href="#grass-tuft" x="166" y="606" width="24" height="24" transform="rotate(14 178 618)"/>
      <use href="#grass-tuft" x="832" y="294" width="24" height="24" transform="rotate(-12 844 306)"/>
      <use href="#grass-tuft" x="840" y="718" width="24" height="24"/>
    </g>
  </g>

  <!-- Bewust lege modules: geen borden, haaientanden of weggebruikers -->
  <g id="module-traffic-signs" data-module="traffic-signs"/>
  <g id="module-yield-markings" data-module="yield-markings"/>
  <g id="module-road-users" data-module="road-users"/>
  <g id="module-learning-overlay" data-module="learning-overlay"/>
</svg>
