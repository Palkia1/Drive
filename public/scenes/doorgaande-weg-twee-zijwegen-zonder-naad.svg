<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description" data-render="seamless-curbs">
  <title id="title">Doorgaande weg met twee zijwegen en haaientanden</title>
  <desc id="description">Vierkant bovenaanzicht van een doorgaande horizontale weg. Twee tegenoverliggende zijwegen sluiten aan. Alleen de naderende rijstrook van beide zijwegen heeft vier haaientanden.</desc>

  <defs>
    <symbol id="tree" viewBox="-44 -44 88 88">
      <circle cx="0" cy="5" r="35" fill="#568e4e"/>
      <circle cx="-14" cy="-9" r="23" fill="#72aa5e"/>
      <circle cx="14" cy="-10" r="20" fill="#82b868"/>
      <circle cx="15" cy="15" r="18" fill="#659e56"/>
    </symbol>
  </defs>

  <g id="background">
    <!-- Eén ononderbroken asfaltvlak voorkomt naden binnen het kruisingsvlak. -->
    <rect width="1024" height="1024" fill="#596168"/>
  </g>

  <g id="sidewalks" fill="#d8dadb" shape-rendering="crispEdges">
    <!-- Concentrische cirkelbogen: de binnenbocht heeft overal exact dezelfde kromming. -->
    <path d="M0 0h412v326a66 66 0 0 1-66 66H0z"/>
    <path d="M612 0h412v392H678a66 66 0 0 1-66-66z"/>
    <path d="M0 632h346a66 66 0 0 1 66 66v326H0z"/>
    <path d="M678 632h346v392H612V698a66 66 0 0 1 66-66z"/>
  </g>

  <g id="grass" shape-rendering="crispEdges">
    <!-- De buitenbocht gebruikt hetzelfde middelpunt en een straal van 30 px: stoepbreedte 36 px. -->
    <path d="M0 0h376v326a30 30 0 0 1-30 30H0z" fill="#9fc77d"/>
    <path d="M648 0h376v356H678a30 30 0 0 1-30-30z" fill="#9fc77d"/>
    <path d="M0 668h346a30 30 0 0 1 30 30v326H0z" fill="#9fc77d"/>
    <path d="M678 668h346v356H648V698a30 30 0 0 1 30-30z" fill="#9fc77d"/>

    <path d="M0 0h266c-11 65-54 109-130 132C84 148 39 147 0 131z" fill="#a7cc85"/>
    <path d="M790 846c79-36 157-32 234 12v166H757c-16-62-5-122 33-178z" fill="#a7cc85"/>
  </g>

  <g id="lane-markings" fill="none" stroke="#f7f5ed" stroke-width="8" stroke-linecap="butt">
    <!-- Volledige, gelijkmatige strepen; het kruisingsvlak en de afgeronde hoeken blijven vrij. -->
    <path d="M0 512h64m44 0h64m44 0h64"/>
    <path d="M744 512h64m44 0h64m44 0h64"/>
    <path d="M512 0v64m0 44v64m0 44v64"/>
    <path d="M512 744v64m0 44v64m0 44v64"/>
  </g>

  <g id="yield-markings" fill="#f7f5ed">
    <!-- Bovenste zijweg: verkeer rijdt naar beneden; de punten wijzen daarom omhoog. -->
    <g id="yield-top">
      <path d="M425 302l-9 20h18z"/>
      <path d="M449 302l-9 20h18z"/>
      <path d="M473 302l-9 20h18z"/>
      <path d="M497 302l-9 20h18z"/>
    </g>

    <!-- Onderste zijweg: verkeer rijdt naar boven; de punten wijzen daarom omlaag. -->
    <g id="yield-bottom">
      <path d="M527 722l-9-20h18z"/>
      <path d="M551 722l-9-20h18z"/>
      <path d="M575 722l-9-20h18z"/>
      <path d="M599 722l-9-20h18z"/>
    </g>
  </g>

  <g id="landscape-details">
    <g id="trees">
      <use href="#tree" x="66" y="58" width="100" height="100"/>
      <use href="#tree" x="170" y="208" width="72" height="72"/>
      <use href="#tree" x="830" y="78" width="92" height="92"/>
      <use href="#tree" x="865" y="818" width="100" height="100"/>
      <use href="#tree" x="94" y="842" width="82" height="82"/>
    </g>

    <g id="grass-details" fill="none" stroke="#78aa62" stroke-width="5" stroke-linecap="round" opacity=".65">
      <path d="M91 253l-8-15m8 15 9-18m-9 18 1-25"/>
      <path d="M250 112l-8-15m8 15 9-18m-9 18 1-25"/>
      <path d="M781 226l-8-15m8 15 9-18m-9 18 1-25"/>
      <path d="M898 274l-8-15m8 15 9-18m-9 18 1-25"/>
      <path d="M224 804l-8-15m8 15 9-18m-9 18 1-25"/>
      <path d="M779 904l-8-15m8 15 9-18m-9 18 1-25"/>
    </g>
  </g>
</svg>
