<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Modulaire eenbaansrotonde</title>
  <desc id="desc">Vierkante illustratie in loodrecht bovenaanzicht van een lege eenbaansrotonde met vier aansluitingen, afgeronde stoepen en groene bermen.</desc>

  <defs>
    <symbol id="grass-tuft" viewBox="-12 -12 24 24">
      <path d="M0 10C-1 2-5-4-10-8M0 10C1 1 5-5 10-9M0 10C0 0-1-7 1-12" fill="none" stroke="#659951" stroke-width="3" stroke-linecap="round"/>
    </symbol>
  </defs>

  <!-- LAAG 1: groene ondergrond -->
  <g id="module-background" data-module="background">
    <rect width="1024" height="1024" fill="#9FC77D"/>
    <path d="M0 0H225L0 225Z" fill="#ADD18C" opacity=".55"/>
    <path d="M1024 1024H800L1024 800Z" fill="#ADD18C" opacity=".45"/>
  </g>

  <!-- LAAG 2: stoepzone rond de rotonde en de vier aansluitingen -->
  <g id="module-sidewalks" data-module="sidewalks" fill="#D8DADB">
    <rect x="372" width="280" height="1024"/>
    <rect y="372" width="1024" height="280"/>
    <circle cx="512" cy="512" r="276"/>
  </g>

  <!-- LAAG 3: wegdek; de ring bevat precies één circulerende rijstrook -->
  <g id="module-roads" data-module="roads" fill="#596168">
    <rect x="398" width="228" height="1024"/>
    <rect y="398" width="1024" height="228"/>
    <circle cx="512" cy="512" r="242"/>
  </g>

  <!-- LAAG 4: buitenste stoepranden, onderbroken bij de aansluitingen -->
  <g id="module-outer-curbs" data-module="outer-curbs" fill="none" stroke="#41494F" stroke-width="7" stroke-linecap="round">
    <path d="M398 0V299M626 0V299"/>
    <path d="M398 725V1024M626 725V1024"/>
    <path d="M0 398H299M0 626H299"/>
    <path d="M725 398H1024M725 626H1024"/>
    <path d="M398 299A242 242 0 0 0 299 398"/>
    <path d="M626 299A242 242 0 0 1 725 398"/>
    <path d="M725 626A242 242 0 0 1 626 725"/>
    <path d="M398 725A242 242 0 0 1 299 626"/>
  </g>

  <!-- LAAG 5: middenstrepen op de aansluitende wegen -->
  <g id="module-road-markings" data-module="road-markings" fill="none" stroke="#F7F5ED" stroke-width="10" stroke-linecap="butt" stroke-dasharray="48 32">
    <path d="M512 0V240"/>
    <path d="M512 784V1024"/>
    <path d="M0 512H240"/>
    <path d="M784 512H1024"/>
  </g>

  <!-- LAAG 6: haaientanden uitsluitend op de vier inrijdende rijstroken -->
  <g id="module-yield-markings" data-module="yield-markings" fill="#F7F5ED">
    <!-- Noord: verkeer rijdt naar beneden; inrijstrook ligt links in beeld -->
    <path d="M410 275H422L416 260Z M434 275H446L440 260Z M458 275H470L464 260Z M482 275H494L488 260Z"/>
    <!-- Zuid: verkeer rijdt naar boven; inrijstrook ligt rechts in beeld -->
    <path d="M530 769H542L536 784Z M554 769H566L560 784Z M578 769H590L584 784Z M602 769H614L608 784Z"/>
    <!-- West: verkeer rijdt naar rechts; inrijstrook ligt onder in beeld -->
    <path d="M275 530V542L260 536Z M275 554V566L260 560Z M275 578V590L260 584Z M275 602V614L260 608Z"/>
    <!-- Oost: verkeer rijdt naar links; inrijstrook ligt boven in beeld -->
    <path d="M769 410V422L784 416Z M769 434V446L784 440Z M769 458V470L784 464Z M769 482V494L784 488Z"/>
  </g>

  <!-- LAAG 7: middeneiland met stoepband -->
  <g id="module-central-island" data-module="central-island">
    <circle cx="512" cy="512" r="132" fill="#D8DADB" stroke="#41494F" stroke-width="7"/>
    <circle cx="512" cy="512" r="104" fill="#9FC77D" stroke="#B8BDC0" stroke-width="5"/>
    <path d="M438 438A104 104 0 0 1 512 408A104 104 0 0 1 586 438L512 512Z" fill="#ADD18C" opacity=".48"/>
    <use href="#grass-tuft" x="467" y="463" width="24" height="24" transform="rotate(-18 479 475)"/>
    <use href="#grass-tuft" x="541" y="526" width="24" height="24" transform="rotate(14 553 538)"/>
    <use href="#grass-tuft" x="480" y="554" width="24" height="24"/>
  </g>

  <!-- LAAG 8: rustige grasdetails, zonder bloemen -->
  <g id="module-landscape-details" data-module="landscape-details" opacity=".9">
    <use href="#grass-tuft" x="72" y="92" width="24" height="24"/>
    <use href="#grass-tuft" x="250" y="175" width="24" height="24" transform="rotate(18 262 187)"/>
    <use href="#grass-tuft" x="780" y="110" width="24" height="24" transform="rotate(-14 792 122)"/>
    <use href="#grass-tuft" x="916" y="264" width="24" height="24"/>
    <use href="#grass-tuft" x="125" y="826" width="24" height="24" transform="rotate(-12 137 838)"/>
    <use href="#grass-tuft" x="251" y="934" width="24" height="24"/>
    <use href="#grass-tuft" x="782" y="877" width="24" height="24" transform="rotate(15 794 889)"/>
    <use href="#grass-tuft" x="910" y="754" width="24" height="24"/>
  </g>

  <!-- Lege modulaire invoeglagen voor volgende verkeerssituaties -->
  <g id="module-traffic-signs" data-module="traffic-signs"/>
  <g id="module-road-users" data-module="road-users"/>
  <g id="module-learning-overlay" data-module="learning-overlay"/>
</svg>
